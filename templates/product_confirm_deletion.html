
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Product | SS India Roofing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark" style="background:#2053a3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            SS INDIA ROOFING
        </a>
        <a href="{% url 'product_list' %}" class="btn btn-outline-light btn-sm">
            Back to Products
        </a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 text-center">
                <div class="card-body p-4 p-md-5">
                    <div class="display-4 text-danger mb-3">!</div>

                    <h1 class="h3 fw-bold">Delete Product?</h1>

                    <p class="text-secondary mt-3">
                        Are you sure you want to delete
                        <strong class="text-dark">{{ product.name }}</strong>?
                    </p>

                    <p class="small text-danger">
                        This action cannot be undone.
                    </p>

                    <form method="POST" class="mt-4">
                        {% csrf_token %}

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg">
                                Yes, Delete Product
                            </button>
                            <a href="{% url 'product_list' %}"
                               class="btn btn-outline-secondary">
                                No, Keep Product
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
