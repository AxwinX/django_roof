<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Appointment | SS India Roofing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark" style="background:#2053a3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            SS INDIA ROOFING
        </a>
        <a href="{% url 'appointment_list' %}" class="btn btn-outline-light btn-sm">
            Back to Appointments
        </a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">
            <div class="mb-4">
                <p class="text-primary fw-semibold mb-1">ADMINISTRATION</p>
                <h1 class="fw-bold">{{ title|default:"Update Appointment Status" }}</h1>
                <p class="text-secondary">Update the status for {{ appointment.first_name }} {{ appointment.last_name }}.</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label for="status" class="form-label fw-semibold">Appointment Status</label>
                            <select name="status" id="status" class="form-select form-select-lg" required>
                                {% for value, label in status_choices %}
                                <option value="{{ value }}" {% if appointment.status == value %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="alert alert-info">
                            <i class="fa-solid fa-info-circle me-2"></i>
                            Current status: <strong>{{ appointment.get_status_display }}</strong>
                        </div>

                        <div class="d-flex flex-wrap gap-2 mt-4">
                            <button type="submit" class="btn btn-warning btn-lg flex-grow-1">
                                <i class="fa-solid fa-save me-1"></i>Save Status
                            </button>
                            <a href="{% url 'appointment_detail' appointment.pk %}" class="btn btn-outline-secondary btn-lg">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
</body>
</html>
